{% extends "base.html" %}{% block content %}<div class="form"><h1>Create Account</h1>{% if error %}<p class="error">{{error}}</p>{% endif %}<form method="post"><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label><button class="btn">Register</button></form></div>{% endblock %}
