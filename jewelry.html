{% extends "base.html" %}{% block content %}<div class="form"><h1>💎 Jewelry Planner</h1><form method="post" action="/generate-jewelry" enctype="multipart/form-data"><label>Budget ₹<input type="number" name="budget" min="1" required></label><label>Occasion<select name="occasion"><option>Wedding</option><option>Reception</option><option>Festival</option><option>College Function</option><option>Party</option><option>Daily Wear</option></select></label><label>Style<select name="style"><option>Elegant</option><option>Traditional</option><option>Minimalist</option><option>Modern</option><option>Bridal</option></select></label><label>Outfit Details<textarea name="outfit_details" placeholder="Example: dark violet saree with pink border"></textarea></label><label>Outfit Image (optional)<input type="file" name="outfit_image" accept=".jpg,.jpeg,.png,.webp"></label><button class="btn">Generate</button></form></div>{% endblock %}
